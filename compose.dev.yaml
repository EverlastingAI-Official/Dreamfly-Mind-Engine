# Local development only; all host ports bind to loopback.
services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
