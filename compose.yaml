name: dreamfly

# Runnable infrastructure only. API/worker/web/migrations are not implemented yet.
# Remote default: PostgreSQL has no host port. Use compose.dev.yaml locally.
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dreamfly}
      POSTGRES_USER: ${POSTGRES_USER:-dreamfly}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password.txt}

volumes:
  postgres_data:
