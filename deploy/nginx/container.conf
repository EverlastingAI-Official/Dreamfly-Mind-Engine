map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 55m;

    # Docker DNS must be refreshed when the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3001;

    location ~ ^/api(?:/|$) {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # BaoTa overwrites X-Real-IP; never append a client-supplied forwarding chain.
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    include /etc/nginx/dreamfly-pages.conf;

    location ~ ^/(assets|static)/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ \. {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @missing_page;
    }

    location @missing_page {
        error_page 404 /index.html;
        return 404;
    }
}
